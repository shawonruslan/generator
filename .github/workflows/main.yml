name: Remotion Studio and render
run-name: Remotion ${{ inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: studio = open Remotion Studio in the browser; render = make the MP4 directly
        type: choice
        required: true
        default: studio
        options:
          - studio
          - render
      minutes:
        description: Studio session length after startup (studio mode only)
        type: choice
        required: true
        default: '330'
        options:
          - '330'
          - '60'
          - '30'
      composition:
        description: Composition ID to render (render mode only)
        type: string
        required: true
        default: Main

permissions:
  contents: read

concurrency:
  group: remotion-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  remotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      PROJECT_DIR: ${{ github.workspace }}/my-remotion

    steps:
      - name: Check out your project repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create starter project if my-remotion is missing
        run: |
          set -euo pipefail
          if [[ -f "$PROJECT_DIR/package.json" ]]; then
            echo 'Using your my-remotion project from the repository.'
            exit 0
          fi
          echo '::notice::No my-remotion folder found. Creating a starter project. Commit it to your repo to keep your code.'
          mkdir -p "$PROJECT_DIR/src"
          cat > "$PROJECT_DIR/package.json" <<'EOF'
          {
            "name": "my-remotion",
            "private": true,
            "type": "module",
            "scripts": {
              "studio": "remotion studio src/index.ts",
              "render": "remotion render src/index.ts"
            },
            "dependencies": {
              "@remotion/cli": "4.0.538",
              "react": "19.1.0",
              "react-dom": "19.1.0",
              "remotion": "4.0.538"
            },
            "devDependencies": {
              "@types/react": "19.1.8",
              "typescript": "5.8.3"
            }
          }
          EOF
          cat > "$PROJECT_DIR/tsconfig.json" <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "ESNext",
              "moduleResolution": "Bundler",
              "jsx": "react-jsx",
              "strict": true,
              "skipLibCheck": true,
              "noEmit": true
            },
            "include": ["src"]
          }
          EOF
          cat > "$PROJECT_DIR/src/index.ts" <<'EOF'
          import { registerRoot } from "remotion";
          import { RemotionRoot } from "./Root";

          registerRoot(RemotionRoot);
          EOF
          cat > "$PROJECT_DIR/src/Root.tsx" <<'EOF'
          import { Composition } from "remotion";
          import { Main } from "./Main";

          // Change size, fps and length here. Example vertical 3K: width 1620, height 2880.
          export const RemotionRoot: React.FC = () => {
            return (
              <Composition
                id="Main"
                component={Main}
                durationInFrames={300}
                fps={30}
                width={1920}
                height={1080}
              />
            );
          };
          EOF
          cat > "$PROJECT_DIR/src/Main.tsx" <<'EOF'
          import { AbsoluteFill, interpolate, spring, useCurrentFrame, useVideoConfig } from "remotion";

          export const Main: React.FC = () => {
            const frame = useCurrentFrame();
            const { fps, width, height } = useVideoConfig();
            const u = Math.min(width, height) / 1080;

            // Ball drops with a real spring bounce
            const drop = spring({ frame, fps, config: { damping: 9, stiffness: 120, mass: 1 } });
            const ballY = interpolate(drop, [0, 1], [-300 * u, height * 0.55]);
            const glow = interpolate(Math.sin((frame / fps) * Math.PI), [-1, 1], [0.4, 1]);

            return (
              <AbsoluteFill style={{ background: "radial-gradient(circle at 50% 40%, #2a1060, #07031a 70%)" }}>
                <div
                  style={{
                    position: "absolute",
                    left: width / 2 - 90 * u,
                    top: ballY - 90 * u,
                    width: 180 * u,
                    height: 180 * u,
                    borderRadius: "50%",
                    background: "radial-gradient(circle at 35% 30%, #ffffff, #22d3ee 45%, #0e7490)",
                    boxShadow: `0 0 ${80 * u * glow}px ${20 * u * glow}px rgba(34,211,238,0.6)`,
                  }}
                />
              </AbsoluteFill>
            );
          };
          EOF

      - name: Install Remotion (bundled FFmpeg, no apt install)
        timeout-minutes: 10
        working-directory: my-remotion
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          npx remotion versions
          npx remotion browser ensure

      - name: Render MP4
        if: ${{ inputs.mode == 'render' }}
        working-directory: my-remotion
        env:
          COMPOSITION: ${{ inputs.composition }}
        run: |
          set -euo pipefail
          if [[ ! "$COMPOSITION" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo '::error::Composition ID may only contain letters, numbers, - and _.'
            exit 1
          fi
          npx remotion compositions src/index.ts
          npx remotion render src/index.ts "$COMPOSITION" "out/$COMPOSITION.mp4"
          ls -lh out/
          echo "Rendered out/$COMPOSITION.mp4. Download it from the remotion-output artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned Cloudflare client
        if: ${{ inputs.mode == 'studio' }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.3/cloudflared-linux-amd64 \
            --output "$RUNNER_TEMP/cloudflared"
          echo "053b80b0a23031a038fdbf3c073f59f82b8f1f152aa67971d7383ffafc0dbab0  $RUNNER_TEMP/cloudflared" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" version

      - name: Start Remotion Studio session
        if: ${{ inputs.mode == 'studio' }}
        working-directory: my-remotion
        env:
          SESSION_MINUTES: ${{ inputs.minutes }}
        run: |
          set -euo pipefail
          case "$SESSION_MINUTES" in 30|60|330) ;; *) exit 1 ;; esac
          STUDIO_PID=''
          TUNNEL_PID=''
          cleanup() {
            [[ -z "$TUNNEL_PID" ]] || kill "$TUNNEL_PID" 2>/dev/null || true
            [[ -z "$STUDIO_PID" ]] || kill "$STUDIO_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          npx remotion studio src/index.ts --port 3000 --no-open \
            > "$RUNNER_TEMP/studio.log" 2>&1 &
          STUDIO_PID=$!

          READY=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              READY=true
              break
            fi
            if ! kill -0 "$STUDIO_PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ "$READY" != true ]]; then
            tail -n 80 "$RUNNER_TEMP/studio.log"
            echo '::error::Remotion Studio did not start. Check the log above for code errors.'
            exit 1
          fi

          "$RUNNER_TEMP/cloudflared" tunnel --no-autoupdate --protocol http2 \
            --url http://127.0.0.1:3000 \
            > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          TUNNEL_PID=$!

          PUBLIC_URL=''
          for attempt in $(seq 1 60); do
            PUBLIC_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' \
              "$RUNNER_TEMP/cloudflared.log" | head -n 1 || true)
            if [[ -n "$PUBLIC_URL" ]]; then break; fi
            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ -z "$PUBLIC_URL" ]]; then
            echo '::error::Cloudflare did not provide a tunnel URL.'
            tail -n 40 "$RUNNER_TEMP/cloudflared.log"
            exit 1
          fi

          echo "Open Remotion Studio: $PUBLIC_URL"
          {
            echo '## Remotion Studio'
            echo
            echo "[Open Remotion Studio]($PUBLIC_URL)"
            echo
            echo 'No login is required. Anyone with this link can open it, so do not share it.'
            echo
            echo "Session duration: $SESSION_MINUTES minutes after startup. Allow a few seconds for the tunnel to connect."
            echo
            echo 'Use the Render button in Studio. Rendered files are saved to my-remotion/out/ and included in the remotion-output artifact when the session ends.'
          } >> "$GITHUB_STEP_SUMMARY"

          DEADLINE=$((SECONDS + SESSION_MINUTES * 60))
          while (( SECONDS < DEADLINE )); do
            if ! kill -0 "$STUDIO_PID" 2>/dev/null || ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo '::error::Remotion Studio or the tunnel stopped unexpectedly.'
              tail -n 60 "$RUNNER_TEMP/studio.log"
              tail -n 40 "$RUNNER_TEMP/cloudflared.log"
              exit 1
            fi
            sleep 10
          done

      - name: Save rendered videos and project files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: remotion-output-${{ github.run_id }}
          path: |
            my-remotion/
            !my-remotion/node_modules/**
            !my-remotion/**/.cache/**
            !my-remotion/**/.env*
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 3
